name: Build and Publish Release with Attestations

on:
  release:
    types: [created] # Triggers when a new release is created

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for generating the attestation token
      contents: write # Required for creating/uploading release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Define the common parameters to keep things organized
      - name: Define Attestation Parameters
        id: params
        run: |
          echo "build-type=obsidian-plugin-release" >> $GITHUB_OUTPUT
          echo "repo-url=${{ github.server_url }}/${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "workflow-run-id=${{ github.run_id }}" >> $GITHUB_OUTPUT

      # Generate attestations for each asset
      - name: Generate Attestation for manifest.json
        uses: github/actions/artifact-attestation/create-attestation@v1
        with:
          artifact-path: 'manifest.json'
          artifact-name: 'manifest.json'
          build-type: ${{ steps.params.outputs.build-type }}
          repo-url: ${{ steps.params.outputs.repo-url }}
          workflow-run-id: ${{ steps.params.outputs.workflow-run-id }}

      - name: Generate Attestation for main.js
        uses: github/actions/artifact-attestation/create-attestation@v1
        with:
          artifact-path: 'main.js'
          artifact-name: 'main.js'
          build-type: ${{ steps.params.outputs.build-type }}
          repo-url: ${{ steps.params.outputs.repo-url }}
          workflow-run-id: ${{ steps.params.outputs.workflow-run-id }}

      - name: Generate Attestation for styles.css
        uses: github/actions/artifact-attestation/create-attestation@v1
        with:
          artifact-path: 'styles.css'
          artifact-name: 'styles.css'
          build-type: ${{ steps.params.outputs.build-type }}
          repo-url: ${{ steps.params.outputs.repo-url }}
          workflow-run-id: ${{ steps.params.outputs.workflow-run-id }}

      # Upload the attestations to the release
      - name: Upload manifest.json Attestation
        uses: github/actions/artifact-attestation/upload-attestation@v1
        with:
          attestation-name: 'attestation-manifest.json'

      - name: Upload main.js Attestation
        uses: github/actions/artifact-attestation/upload-attestation@v1
        with:
          attestation-name: 'attestation-main.js'

      - name: Upload styles.css Attestation
        uses: github/actions/artifact-attestation/upload-attestation@v1
        with:
          attestation-name: 'attestation-styles.css'

      # Upload the assets to the release
      - name: Upload release assets
        run: |
          gh release upload ${{ github.event.release.tag_name }} manifest.json main.js styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}