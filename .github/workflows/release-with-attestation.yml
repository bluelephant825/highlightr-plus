name: Build and Publish Release with Attestations

on:
  release:
    types: [created] # Triggers when a new release is created

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for generating the attestation token
      contents: write # Required for creating/uploading release assets
      attestations: write # Required for creating artifact attestations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestation for manifest.json
        uses: actions/attest@v4
        with:
          subject-path: 'manifest.json'

      - name: Generate artifact attestation for main.js
        uses: actions/attest@v4
        with:
          subject-path: 'main.js'

      - name: Generate artifact attestation for styles.css
        uses: actions/attest@v4
        with:
          subject-path: 'styles.css'

      - name: Upload release assets
        run: |
          gh release upload ${{ github.event.release.tag_name }} manifest.json main.js styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}